[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PACKAGING TODO [PACKAGE-NAME] - RELEASE BLOCKER
# Missing: The final public distribution name selected by the team.
# Needed for: Python package publication, the Bioconda recipe, and user install commands.
# Replace: Change this temporary value everywhere listed in packaging/README.md.
name = "package-name-pending"

# PACKAGING TODO [VERSION] - RELEASE BLOCKER
# Missing: Agreement on the authoritative version and release process.
# Needed for: Matching Git tags, source archives, Python packages, and Bioconda releases.
# Replace: Use the agreed release version; 0.0.0 must never be published.
version = "0.0.0"

description = "Draft packaging skeleton for the telomere analysis workflow"
readme = "README.md"
requires-python = ">=3.10"

# Dependency audit result:
# - The workflow backend uses only the Python standard library.
# - The combined CLI/GUI distribution directly imports PySide6.
# - PySide6 installs its Essentials, Addons, and shiboken6 dependencies itself, so those
#   transitive packages are intentionally not repeated here.
dependencies = [
    "openpyxl>=3.1,<4",
    "PySide6>=6.10,<7",
]

# PACKAGING TODO [LICENSE] - RELEASE BLOCKER
# Missing: The SPDX identifier for the project license selected by the team.
# Needed for: Python package metadata and Bioconda submission.
# Replace: Add the approved LICENSE file, then add a valid `license` field here.

# PACKAGING TODO [AUTHORS]
# Missing: The names and optional email addresses that should appear as package authors.
# Needed for: Clear project attribution in published package metadata.
# Replace: Add an `authors = [...]` array after the team confirms attribution.

# PACKAGING TODO [MAINTAINERS]
# Missing: The people responsible for packaging and release updates.
# Needed for: Release ownership and future package maintenance.
# Replace: Add a `maintainers = [...]` array after responsibilities are assigned.

# PACKAGING TODO [PROJECT-URLS]
# Missing: Final repository, documentation, issue tracker, and publication URLs.
# Needed for: Package metadata and user support links.
# Replace: Add a `[project.urls]` table when the public locations are confirmed.

[project.scripts]
# PACKAGING TODO [ENTRY-POINTS]
# `telomere-analyzer` is an approved temporary GUI command and may change with the final package name.
# Backend workflow subcommands remain internal and are not exposed as the supported user interface.
telomere-analyzer = "dorado_gui.main:main"

[tool.setuptools]
# Non-Python resources are included only through the explicit package-data allowlist below.
# Git-tracked files that do not match these patterns must not enter the installed wheel.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["dorado_workflow*", "dorado_gui*"]
namespaces = true

[tool.setuptools.package-data]
dorado_workflow = [
    "configs/default_config.json",
    "data/NanoTel.R",
    "r_analysis/main_analysis_pipeline.R",
    "r_analysis/batch_mapping_analysis.R",
    "r_analysis/batch_methylation_prep.R",
    "r_analysis/batch_nanotel_analysis.R",
    "r_analysis/functions/mapping_functions.R",
    "r_analysis/functions/methylation_functions.R",
    "r_analysis/functions/nanotel_functions.R",
    "r_analysis/functions/utils.R",
]
dorado_gui = [
    "icons/bam.png",
    "icons/basecalling.png",
    "icons/checked.png",
    "icons/fastq.png",
    "icons/folder.png",
    "icons/nanotel.png",
    "icons/pod5.png",
    "icons/sub_basecalling.png",
    "icons/sub_nanotel.png",
]

