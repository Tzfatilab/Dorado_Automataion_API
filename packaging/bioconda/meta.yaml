  name: {{ name|lower }}
  version: {{ version }}

# PACKAGING TODO [SOURCE-URL] - RELEASE BLOCKER
# Missing: The permanent URL for the tagged GitHub source archive.
# Needed for: Allowing Bioconda to download a reproducible copy of the source.
# Replace: Add a `source` section with `url` after the first release is tagged.

# PACKAGING TODO [SOURCE-SHA256] - RELEASE BLOCKER
# Missing: The SHA256 checksum of the exact source archive specified above.
# Needed for: Detecting changed or corrupted release downloads.
# Replace: Add `sha256` to the `source` section; never use a placeholder checksum.

build:
  number: 0
  noarch: python

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.10
    - pyside6 >=6.10,<7
    - minimap2
    - samtools
    - ont-modkit
    - r-base
    - r-optparse
    - bioconductor-biocgenerics
    - bioconductor-s4vectors
    - bioconductor-iranges
    - bioconductor-biostrings
    - r-conflicted
    - r-dplyr
    - r-readr
    - r-tidyr
    - r-purrr
    - r-stringr
    - r-ggplot2
    - r-future
    - r-logr
    - r-ggprism
    - r-testit
    - r-survival
    - r-plotly
    - r-shiny
    - r-htmlwidgets
    - r-htmltools
    - r-rcolorbrewer
    - r-gridextra
    - r-fuzzyjoin
    - r-readxl
    - r-jsonlite

    # Dependency audit result:
    # - The Python backend uses only the standard library.
    # - The GUI directly imports PySide6; its lower-level Qt/shiboken packages are transitive.
    # - Core R-analysis and NanoTel direct dependencies are listed explicitly above.
    # The dependency set passed the real-data tests in an isolated Linux environment on 2026-08-05
    # and from the actual locally built Conda package on 2026-08-06.

    # The source-audited direct dependencies are active above. The base-R parallel package does
    # not need a separate Conda entry, and tibble is transitive through dplyr/readr.
    # Intentionally not direct dependencies: r-tidyverse, r-forcats, and r-lubridate.
    # r-tidyr remains required by the separate core R-analysis scripts.
    # The representative NanoTel/mapping test below passed against the built package.
    # See packaging/R_DEPENDENCIES.md for the classification and test plan.

    # Modkit is installed from its existing Bioconda package because the GUI's pending
    # methylation workflow can invoke the `modkit` command. The current integration
    # fixture has no MM/ML tags, so a real pileup result still needs separate coverage.

    # Dorado is intentionally not listed as a Conda dependency in this draft.
    # PACKAGING TODO [DORADO] - RELEASE BLOCKER
    # The SUP v5.2.0 model is pinned and both Dorado and its model remain external.
    # Missing: Record the exact tested Dorado executable version and installation instructions.
    # See packaging/DORADO_COMPATIBILITY.md for the public workflow and compatibility policy.

test:
  # conda-build stores source_files in the artifact's info/test metadata for future retesting.
  # They are not installed into the runtime environment.
  source_files:
    - tests/test_real_integration.py
    - tests/fixtures/integration/README.md
    - tests/fixtures/integration/manifest.json
    - tests/fixtures/integration/expected_results.json
    - tests/fixtures/integration/fastq/barcode19/test_reads_barcode19.fastq.gz
    - tests/fixtures/integration/bam/barcode07/test_aligned_barcode07.bam
    - tests/fixtures/integration/bam/barcode07/test_aligned_barcode07.bam.bai
  commands:
    # All commands below passed against the locally built Conda package on 2026-08-06.
    # Official Bioconda CI must repeat them after the release metadata is complete.
    - telomere-analyzer --help
    - telomere-analyzer --version
    - QT_QPA_PLATFORM=offscreen python -c "from PySide6.QtCore import QTimer; from PySide6.QtWidgets import QApplication; from dorado_gui.main import AppWindow; app = QApplication([]); window = AppWindow(); window.show(); QTimer.singleShot(250, app.quit); assert app.exec() == 0"
    - python -c "from pathlib import Path; from dorado_workflow.managers.config_manager import ConfigManager; c = ConfigManager(); assert Path(c.config_path).is_file(); assert Path(c.get_nanotel_script_path()).is_file()"
    - python -c "from pathlib import Path; import dorado_workflow; p = Path(dorado_workflow.__file__).parent / 'r_analysis'; assert (p / 'main_analysis_pipeline.R').is_file(); assert len(list((p / 'functions').glob('*.R'))) == 4"
    - python -c "from importlib.util import find_spec; from pathlib import Path; p = Path(next(iter(find_spec('dorado_gui').submodule_search_locations))) / 'icons'; assert len(list(p.glob('*.png'))) == 9"
    - R -e "pkgs <- c('optparse', 'BiocGenerics', 'S4Vectors', 'IRanges', 'Biostrings', 'conflicted', 'dplyr', 'readr', 'purrr', 'stringr', 'ggplot2', 'future', 'logr', 'ggprism', 'testit', 'survival'); stopifnot(all(vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)))"
    - RUN_REAL_INTEGRATION_TESTS=1 python -m unittest discover -s tests -p "test_real_integration.py" -v

about:
  summary: "Draft packaging skeleton for the telomere analysis workflow"

